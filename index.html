<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sel Startpage</title>
  <style>
    :root {
      --bg: #F7F3EC;
      --paper: rgba(255, 255, 255, 0.58);
      --paper-strong: rgba(255, 255, 255, 0.82);
      --red: #D7352A;
      --text: #2f2d2a;
      --muted: #8b8580;
      --line: rgba(60, 54, 48, 0.16);
      --shadow: 0 18px 44px rgba(85, 67, 48, 0.08);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        "MiSans",
        "HarmonyOS Sans SC",
        "Noto Sans CJK SC",
        "Microsoft YaHei",
        sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.72), transparent 28%),
        radial-gradient(circle at 84% 22%, rgba(255, 255, 255, 0.42), transparent 30%),
        linear-gradient(135deg, #FAF6EF 0%, var(--bg) 56%, #EFE8DC 100%);
      background-attachment: fixed;
    }

    body {
      padding: env(safe-area-inset-top) 18px env(safe-area-inset-bottom);
      display: flex;
      justify-content: center;
    }

    .page {
      width: min(100%, 520px);
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .top-area {
      min-height: 25vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 24px;
      padding: 0 10px 18px;
    }

    .logo {
      text-align: center;
      color: var(--red);
      font-size: clamp(44px, 14vw, 68px);
      font-weight: 740;
      line-height: 1;
      letter-spacing: -0.065em;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        "Helvetica Neue",
        Arial,
        sans-serif;
      text-rendering: geometricPrecision;
    }

    .search-form {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      padding: 6px 6px 6px 12px;
      border-radius: var(--radius);
      background: var(--paper-strong);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .engine {
      appearance: none;
      border: 0;
      outline: none;
      width: 78px;
      padding: 8px 23px 8px 10px;
      border-radius: 12px;
      color: #514b46;
      background:
        linear-gradient(45deg, transparent 50%, #6f6760 50%),
        linear-gradient(135deg, #6f6760 50%, transparent 50%),
        rgba(247, 243, 236, 0.78);
      background-position:
        calc(100% - 13px) 51%,
        calc(100% - 8px) 51%,
        center;
      background-size: 5px 5px, 5px 5px, 100% 100%;
      background-repeat: no-repeat;
      font-size: 12px;
      font-weight: 650;
      flex: 0 0 auto;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      font-weight: 420;
      padding: 9px 2px;
    }

    .search-input::placeholder {
      color: rgba(80, 74, 68, 0.44);
    }

    .search-btn {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      border: 0;
      border-radius: 13px;
      background: var(--red);
      color: #fffaf3;
      font-size: 15px;
      font-weight: 800;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 18px rgba(215, 53, 42, 0.18);
    }

    .search-btn:active {
      transform: scale(0.96);
    }

    .links-area {
      padding: 34px 10px 0;
    }

    .bookmarks {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .bookmark {
      min-height: 84px;
      padding: 12px 6px 10px;
      border-radius: 20px;
      text-decoration: none;
      color: var(--text);
      background: rgba(255, 255, 255, 0.38);
      border: 1px solid rgba(60, 54, 48, 0.10);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 9px;
      box-shadow: 0 12px 28px rgba(85, 67, 48, 0.045);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.14s ease, background 0.14s ease;
    }

    .bookmark:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.58);
    }

    .icon {
      width: 34px;
      height: 34px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      color: #fffaf3;
      background: #2f2d2a;
      font-size: 13px;
      font-weight: 760;
      letter-spacing: -0.03em;
    }

    .bookmark.youtube .icon {
      background: #D7352A;
    }

    .bookmark.x .icon {
      background: #222222;
    }

    .bookmark.ins .icon {
      background: linear-gradient(135deg, #7c3aed, #e11d48, #f59e0b);
    }

    .bookmark.tiktok .icon {
      background: linear-gradient(135deg, #111111, #222222);
      box-shadow:
        2px 0 0 rgba(37, 244, 238, 0.55),
        -2px 0 0 rgba(254, 44, 85, 0.45);
    }

    .name {
      max-width: 100%;
      color: #49443f;
      font-size: 12px;
      font-weight: 560;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .breathing-space {
      flex: 1;
    }

    @media (max-width: 390px) {
      body {
        padding-left: 14px;
        padding-right: 14px;
      }

      .top-area {
        min-height: 25vh;
        padding-left: 0;
        padding-right: 0;
      }

      .links-area {
        padding-left: 0;
        padding-right: 0;
      }

      .bookmarks {
        gap: 10px;
      }

      .bookmark {
        min-height: 78px;
        border-radius: 18px;
      }

      .engine {
        width: 72px;
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="top-area">
      <div class="logo" aria-label="Sel">Sel</div>

      <form class="search-form" id="searchForm" autocomplete="off">
        <select class="engine" id="engine" aria-label="选择搜索引擎">
          <option value="google">Google</option>
          <option value="bing">Bing</option>
          <option value="baidu">百度</option>
          <option value="duck">Duck</option>
        </select>

        <input
          class="search-input"
          id="q"
          type="text"
          placeholder="搜索，或输入网址"
          enterkeyhint="search"
          autofocus
        />

        <button class="search-btn" type="submit" aria-label="搜索">↵</button>
      </form>
    </section>

    <section class="links-area">
      <nav class="bookmarks" aria-label="书签">
        <a class="bookmark youtube" href="https://www.youtube.com/">
          <div class="icon">YT</div>
          <div class="name">YouTube</div>
        </a>

        <a class="bookmark x" href="https://x.com/">
          <div class="icon">X</div>
          <div class="name">X</div>
        </a>

        <a class="bookmark ins" href="https://www.instagram.com/">
          <div class="icon">IG</div>
          <div class="name">Instagram</div>
        </a>

        <a class="bookmark tiktok" href="https://www.tiktok.com/">
          <div class="icon">♪</div>
          <div class="name">TikTok</div>
        </a>
      </nav>
    </section>

    <div class="breathing-space"></div>
  </main>

  <script>
    const form = document.getElementById("searchForm");
    const input = document.getElementById("q");
    const engine = document.getElementById("engine");

    const searchUrls = {
      google: "https://www.google.com/search?q=",
      bing: "https://www.bing.com/search?q=",
      baidu: "https://www.baidu.com/s?wd=",
      duck: "https://duckduckgo.com/?q="
    };

    function looksLikeUrl(text) {
      const value = text.trim();
      if (!value) return false;
      if (/^https?:\/\//i.test(value)) return true;
      if (value.includes(" ") || /[\u4e00-\u9fa5]/.test(value)) return false;
      return /^[a-z0-9-]+(\.[a-z0-9-]+)+([/?#].*)?$/i.test(value);
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const query = input.value.trim();
      if (!query) return;

      if (looksLikeUrl(query)) {
        const target = /^https?:\/\//i.test(query) ? query : "https://" + query;
        window.location.href = target;
        return;
      }

      const base = searchUrls[engine.value] || searchUrls.google;
      window.location.href = base + encodeURIComponent(query);
    });
  </script>
</body>
</html>
